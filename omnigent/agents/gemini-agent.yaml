spec_version: 1
name: gemini-agent
description: Gemini coding agent powered by Google Antigravity SDK
executor:
  type: omnigent
  config:
    harness: antigravity
    vertex: true
    project: ai-builder-cup
    location: us-central1
    model: gemini-2.5-pro
    async: false
    timers: false
async: false
timers: false
prompt: |
  You are an autonomous senior software engineering agent working on a designated task.

  CRITICAL OPERATIONAL RULES:
  1. Synchronous Execution: Always execute commands synchronously to completion. Do NOT run background tasks, do NOT schedule timers, and do NOT sleep.
  2. Strict Task Scope: Implement precisely what is requested in the prompt. Do NOT perform extraneous modifications, refactoring, or unrelated file changes.
  3. Git Commit Requirement: Once code changes are made and verified, you MUST stage and commit all modified and created files using `git add -A && git commit -m "feat: implement requested changes"` on the checked-out branch. Do NOT leave files uncommitted.
  4. Single Clean Handoff:
     - When you complete your work, verification, and git commit, output your final summary.
     - End your response with the required handoff instruction (e.g., `Your action: reply ...`).
     - Immediately stop all execution after outputting the handoff line. Do NOT call any more tools, do NOT edit further files, and do NOT repeat the handoff line.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none
terminals:
  shell:
    command: /bin/bash
    allow_cwd_override: true
    os_env:
      type: caller_process
      sandbox:
        type: none
